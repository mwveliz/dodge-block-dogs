<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge Block Dogs (DBD) - Official Launcher</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        :root {
            --bg: #12131a;
            --card: #1e202b;
            --accent: #00e5ff;
            --btn-play: #00c853;
            --btn-store: #ff6d00;
            --text: #f5f5f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .launcher-card {
            background: var(--card);
            border: 4px solid var(--accent);
            border-radius: 12px;
            max-width: 540px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 12px 35px rgba(0, 229, 255, 0.18);
        }

        .hero-img {
            width: 170px;
            height: 170px;
            border-radius: 16px;
            border: 3px solid #fff;
            margin-bottom: 18px;
            image-rendering: pixelated;
        }

        h1 {
            font-size: 2rem;
            color: #ffca28;
            text-shadow: 2px 2px #000;
            margin-bottom: 8px;
        }

        p.tagline {
            font-size: 0.95rem;
            color: #b0bec5;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            display: block;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.1s ease, filter 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-web {
            background-color: var(--btn-play);
        }

        .btn-itch {
            background-color: #fa5c5c;
        }

        .btn-playstore {
            background-color: var(--btn-store);
        }

        .btn-github {
            background-color: #37474f;
        }

        footer {
            font-size: 0.8rem;
            color: #78909c;
            border-top: 1px solid #2c3040;
            padding-top: 16px;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            margin: 0 8px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="launcher-card">
        <img src="./icon.png" alt="Dodge Block Dogs Logo" class="hero-img">
        <h1>DODGE BLOCK DOGS</h1>
        <p class="tagline">
            Retro pixel-art dog Tamagotchi mixed with fast-paced dodge-block arcade mini-games!
        </p>

        <div class="btn-group">
            <a href="_site/game.html" class="btn btn-web">🕹️ PLAY IN BROWSER (WEB LAUNCHER)</a>
            <a href="https://mwveliz.itch.io/dodge-block-dogs" target="_blank" rel="noopener" class="btn btn-itch">🎮
                GET IT ON ITCH.IO</a>
            <a href="https://github.com/mwveliz/dodge-block-dogs" target="_blank" rel="noopener"
                class="btn btn-github">💻 OPEN SOURCE REPO (GITHUB)</a>
        </div>

        <footer>
            <p>&copy; 2026 Miguel Delgado Veliz</p>
            <p style="margin-top: 8px;">
                <a href="./privacy.html">Privacy Policy</a> |
                <a href="./terms.html">Terms of Service</a>
            </p>
        </footer>
    </div>

</body>

</html>
