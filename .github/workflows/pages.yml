name: Deploy Landing Page & Game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site bundle
        run: |
          mkdir -p _site
          # 1. Compilar el juego completo desde src/game/game.js
          node scripts/build-game.js
          # 2. Generar el paquete ZIP de Itch.io / descarga offline
          node scripts/package-itchio.js
          # 3. Generar Privacy Policy y Terms of Service con estilos y navegación limpia
          node scripts/build-docs.js _site
          # 4. Copiar juego, launcher y recursos estáticos
          cp index.html _site/index.html
          cp game.html _site/game.html
          cp landing.html _site/landing.html
          cp assets/icon.png _site/icon.png
          cp assets/favicon.png _site/favicon.png
          if [ -f assets/three.min.js ]; then cp assets/three.min.js _site/three.min.js; fi
          if [ -f dodge-block-dogs-itchio.zip ]; then cp dodge-block-dogs-itchio.zip _site/dodge-block-dogs-itchio.zip; fi
          if [ -f dist/itchio/dodge-block-dogs-itchio.zip ]; then cp dist/itchio/dodge-block-dogs-itchio.zip _site/dodge-block-dogs-itchio.zip; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4