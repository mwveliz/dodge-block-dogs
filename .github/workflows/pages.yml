name: Deploy Landing Page & Game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site bundle
        run: |
          mkdir -p _site
          # Copiar landing page como index.html
          cp landing.html _site/index.html
          # Copiar el juego y recursos de assets/
          cp assets/game.html _site/game.html
          cp assets/icon.png _site/icon.png
          cp assets/favicon.png _site/favicon.png
          if [ -f assets/three.min.js ]; then cp assets/three.min.js _site/three.min.js; fi
          # Convertir Privacy Policy y Terms of Service a HTML limpio para Google Play
          npx -y marked PRIVACY_POLICY.md > _site/privacy.html
          npx -y marked TERMS_OF_SERVICE.md > _site/terms.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4